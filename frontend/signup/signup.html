<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Ping | Signup</title>
    <link rel="stylesheet" href="/signup/signup.css" />
</head>

<body>

    <div class="container">

        <div class="left">
            <h1>Start sending notifications,<br><span>in minutes.</span></h1>
            <p>
                Create your Ping account and integrate notifications
                into your system with ease.
            </p>
        </div>

        <div class="right">

            <div class="logo">
                <svg viewBox="0 0 100 100" width="42" height="42">
                    <circle cx="50" cy="50" r="4" fill="#4da3ff" />
                    <path d="M50 50 m 0 -20 a 20 20 0 1 1 -14 34 a 14 14 0 1 0 10 -24 a 8 8 0 1 1 -6 14" fill="none"
                        stroke="#4da3ff" stroke-width="2" />
                    <ellipse cx="50" cy="50" rx="30" ry="18" fill="none" stroke="#4da3ff" stroke-width="1.2"
                        opacity="0.25" />
                </svg>
                <span>Ping</span>
            </div>

            <div class="card">
                <h2>Create account</h2>

                <form id="signupForm" autocomplete="off">
                    <input type="text" id = "name" placeholder="Name" required autocomplete="off" />
                    <input type="email" id = "email" placeholder="Email" required autocomplete="off" />
                    <input type="password" id = "password" placeholder="Password" required autocomplete="new-password" />

                    <button type="submit">
                        <span class="btn-text">Signup</span>
                        <div class="spinner hidden"></div>
                    </button>
                </form>

                <p class="switch">
                    Already have an account? <a href="login">Login</a>
                </p>
            </div>

        </div>

    </div>

    <script src="/signup/signup.js"></script>
</body>

</html>
